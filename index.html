
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10172a;
      color: white;
      text-align: center;
      padding: 70px 20px;
    }
    .card {
      max-width: 600px;
      margin: auto;
      padding: 35px 20px;
      background: #1d2942;
      border-radius: 20px;
    }
    h1 { color: #a99cff; font-size: 42px; }
    p { line-height: 1.8; color: #e0e5f5; }
    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #8b7cff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Nexora</h1>
    <p id="description">A new digital experience.</p>
    <button id="languageButton" onclick="toggleLanguage()">فارسی</button>
  </main>

  <script>
    let isPersian = false;

    function toggleLanguage() {
      isPersian = !isPersian;
      document.documentElement.lang = isPersian ? "fa" : "en";
      document.documentElement.dir = isPersian ? "rtl" : "ltr";
      document.getElementById("description").textContent =
        isPersian
          ? "به تجربه دیجیتال جدید Nexora خوش آمدید."
          : "A new digital experience.";
      document.getElementById("languageButton").textContent =
        isPersian ? "English" : "فارسی";
    }
  </script>
</body>
</html>
